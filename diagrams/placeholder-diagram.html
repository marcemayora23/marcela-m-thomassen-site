<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder Diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-thread-slugs="thinking-freely">

  <header>
    <a href="../index.html" class="wordmark">Marcela M. Thomassen</a>
    <nav class="site-nav">
      <a href="../curiosity-threads.html">Curiosity Threads</a>
      <a href="../writing.html">Writing</a>
      <a href="../field-notes.html">Field Notes</a>
      <a href="../diagrams.html" class="active">Diagrams</a>
      <a href="../about.html">About</a>
    </nav>
  </header>

  <main class="diagram-detail">
    <figure class="diagram-expanded">
      <img src="../images/diagrams/placeholder-diagram.png" alt="Placeholder diagram connecting a question to belief, practice, and life">
      <figcaption>Placeholder diagram</figcaption>
    </figure>
    <div class="page-tags" id="page-tags"></div>
  </main>

  <a class="back-link" href="../diagrams.html">&larr; Back to diagrams</a>

  <footer>
    &copy; 2026
  </footer>

  <script>
    (function () {
      var threadMap = {
        'making-a-living': {
          label: 'Making a Living',
          href: '../curiosity-threads/making-a-living.html'
        },
        'thinking-freely': {
          label: 'Thinking Freely',
          href: '../curiosity-threads/thinking-freely.html'
        }
      };

      var slugs = (document.body.getAttribute('data-thread-slugs') || '').split(',').map(function (slug) {
        return slug.trim();
      }).filter(Boolean);

      var tagContainer = document.getElementById('page-tags');
      if (tagContainer && slugs.length) {
        slugs.forEach(function (slug) {
          var thread = threadMap[slug];
          if (!thread) return;
          var tag = document.createElement('a');
          tag.href = thread.href;
          tag.className = 'thread-tag';
          tag.textContent = thread.label;
          tagContainer.appendChild(tag);
        });
      }
    })();
  </script>

</body>
</html>
