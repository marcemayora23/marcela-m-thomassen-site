<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinking in Public</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-thread-slugs="making-a-living">

  <header>
    <a href="../index.html" class="wordmark">Marcela M. Thomassen</a>
    <nav class="site-nav">
      <a href="../curiosity-threads.html">Curiosity Threads</a>
      <a href="../essays.html">Essays</a>
      <a href="../field-notes.html" class="active">Field Notes</a>
      <a href="../great-work.html">Ideas Worth Sharing</a>
      <a href="../about.html">About</a>
    </nav>
  </header>

  <main class="note">
    <div class="note-image" style="background-image: url('../images/field-notes/thinking-in-public.png');"></div>
    <div class="title-row">
      <h1>Thinking in Public</h1>
      <div class="content-share">
        <button class="share-icon" type="button" aria-label="Copy share link" title="Copy share link">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="18" cy="5" r="2.5"></circle>
            <circle cx="6" cy="12" r="2.5"></circle>
            <circle cx="18" cy="19" r="2.5"></circle>
            <path d="m8.2 13.2 7.6 4.6M15.8 6.2 8.2 10.8"></path>
          </svg>
          <span>Share</span>
        </button>
      </div>
    </div>
    <p class="meta">August 2026</p>
    <div class="page-tags" id="page-tags"></div>

    <!-- Replace the paragraphs below with your actual note text.
         Notes can be as short as one paragraph. -->
    <p class="content-placeholder">Placeholder for the Thinking in Public field note.</p>
  </main>

  <a class="back-link" href="../field-notes.html">&larr; Back to all field notes</a>

  <footer>
    &copy; 2026
  </footer>

  <script>
    (function () {
      var threadMap = {
        'making-a-living': {
          label: 'Making a Living',
          href: '../curiosity-threads/making-a-living.html'
        }
      };

      var slugs = (document.body.getAttribute('data-thread-slugs') || '').split(',').map(function (slug) {
        return slug.trim();
      }).filter(Boolean);

      var tagContainer = document.getElementById('page-tags');
      if (tagContainer && slugs.length) {
        slugs.forEach(function (slug) {
          var thread = threadMap[slug];
          if (!thread) return;
          var tag = document.createElement('a');
          tag.href = thread.href;
          tag.className = 'thread-tag';
          tag.textContent = thread.label;
          tagContainer.appendChild(tag);
        });
      }

      var shareButton = document.querySelector('.share-icon');
      shareButton.addEventListener('click', function () {
        var label = shareButton.querySelector('span');
        navigator.clipboard.writeText(window.location.href).then(function () {
          shareButton.setAttribute('aria-label', 'Link copied');
          shareButton.setAttribute('title', 'Link copied');
          label.textContent = 'Link copied';
          shareButton.classList.add('copied');
          setTimeout(function () {
            shareButton.setAttribute('aria-label', 'Copy share link');
            shareButton.setAttribute('title', 'Copy share link');
            label.textContent = 'Share';
            shareButton.classList.remove('copied');
          }, 1500);
        });
      });

    })();
  </script>

</body>
</html>
